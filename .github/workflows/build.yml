name: Compilar APK y AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar herramientas del Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generar Gradle Wrapper si falta
        run: |
          if [ ! -f "./gradlew" ]; then
            mkdir -p /tmp/gradle-init
            printf 'rootProject.name = "PiedraPapelOTijera"\n' > /tmp/gradle-init/settings.gradle
            gradle wrapper --project-dir /tmp/gradle-init
            cp /tmp/gradle-init/gradlew .
            cp -r /tmp/gradle-init/gradle .
          fi
          chmod +x ./gradlew

      - name: Compilar APK (debug) y AAB (release)
        run: |
          printf 'rootProject.name = "PiedraPapelOTijera"\ninclude ":app"\n' > settings.gradle
          ./gradlew assembleDebug bundleRelease

      - name: Subir APK y AAB como Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piedra-papel-o-tijera-android
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
